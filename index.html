<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt-to-Image Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 10px 0;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: center;
            background-color: #444;
            padding: 10px;
        }
        nav a {
            color: #fff;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .input-group input[type="text"] {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .input-group button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .input-group button:hover {
            background-color: #555;
        }
        .result {
            margin-top: 20px;
            text-align: center;
        }
        .result img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
        }
        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Prompt-to-Image Converter</h1>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
    <div class="container">
        <div class="input-group">
            <label for="prompt">Enter your prompt:</label>
            <input type="text" id="prompt" placeholder="e.g., A beautiful sunset over the mountains">
            <button onclick="generateImage()">Generate Image</button>
        </div>
        <div class="result" id="result">
            <!-- Generated image will be displayed here -->
        </div>
    </div>
    <footer>
        <p>&copy; 2023 Prompt-to-Image Converter. All rights reserved.</p>
    </footer>

    <script>
        async function generateImage() {
            const prompt = document.getElementById('prompt').value;
            const resultDiv = document.getElementById('result');

            if (!prompt) {
                alert('Please enter a prompt.');
                return;
            }

            resultDiv.innerHTML = '<p>Generating image... Please wait.</p>';

            try {
                const response = await fetch('https://api-inference.huggingface.co/models/CompVis/stable-diffusion-v1-4', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'hf_sLyJuonCbXkfAaowBrPlVghotWVvZBLRfqQvZzv',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ inputs: prompt })
                });

                if (!response.ok) {
                    throw new Error('Failed to generate image');
                }

                const data = await response.blob();
                const imageUrl = URL.createObjectURL(data);
                resultDiv.innerHTML = `<img src="${imageUrl}" alt="Generated Image">`;
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = '<p>Error generating image. Please try again.</p>';
            }
        }
    </script>
</body>
</html>
